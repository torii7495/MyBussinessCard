<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Your First-Time Discount</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #0017FF;
      --blue-bright: #3040ff;
      --blue-glow: rgba(0, 23, 255, 0.35);
      --blue-soft: rgba(0, 23, 255, 0.12);
      --black: #000000;
      --near-black: #080810;
      --white: #ffffff;
      --off-white: #f0f2ff;
      --gray: #a0a8cc;
      --light-gray: #e8eaf5;
      --card-bg: #0a0c1a;
      --card-border: rgba(0, 23, 255, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(0, 23, 255, 0.22), transparent 45%), var(--black);
      color: var(--white);
    }

    .card {
      width: min(100%, 540px);
      background: linear-gradient(145deg, rgba(10, 12, 26, 0.98), rgba(8, 8, 16, 0.96));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 20px 45px rgba(0, 0, 0, 0.35), 0 0 28px var(--blue-glow);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      color: var(--off-white);
      font-family: 'Eczar', serif;
      font-size: 2rem;
      line-height: 1.2;
    }

    .subtitle {
      color: var(--gray);
      margin-bottom: 24px;
      line-height: 1.7;
    }

    .form-group { margin-bottom: 15px; text-align: left; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.92rem;
      color: var(--light-gray);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
      background: rgba(255,255,255,0.04);
      color: var(--white);
    }

    input::placeholder { color: #7a84a8; }

    button {
      background: var(--blue);
      color: var(--white);
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
      transition: background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 0 rgba(0,0,0,0);
    }

    button:hover {
      background: var(--blue-bright);
      box-shadow: 0 0 18px var(--blue-glow);
    }

    /* Voucher Box Styling */
    .voucher-box {
      display: none;
      background: rgba(0, 23, 255, 0.12);
      border: 1px dashed rgba(0, 23, 255, 0.45);
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }

    .voucher-box h3 {
      color: var(--off-white);
      margin: 0 0 8px 0;
    }

    .code-display {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--white);
      margin: 10px 0;
      background: rgba(255,255,255,0.06);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      display: inline-block;
    }

    .voucher-note {
      font-size: 0.95rem;
      color: var(--gray);
      margin-bottom: 0;
    }

    #errorMsg {
      color: #ff8a8a;
      font-weight: 700;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Claim 15% Off Your First Session</h1>
    <p class="subtitle">Enter your details below to generate a unique discount code for your first booking.</p>

    <form id="discountForm">
      <div class="form-group">
        <label for="client_name">Full Name</label>
        <input type="text" id="client_name" required placeholder="e.g. Alex Morgan">
      </div>
      <div class="form-group">
        <label for="client_email">Email Address</label>
        <input type="email" id="client_email" required placeholder="alex@example.com">
      </div>
      <button type="submit" id="submitBtn">Get My Code</button>
    </form>

    <!-- Success Voucher Display -->
    <div id="voucherBox" class="voucher-box">
      <h3>🎉 Your Discount Code</h3>
      <div class="code-display" id="generatedCode">WELCOME15</div>
      <p class="voucher-note">Show or mention this code when scheduling your session!</p>
    </div>

    <p id="errorMsg"></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://yelkiigjgpzqtqkuuhxt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllbGtpaWdqZ3B6cXRxa3V1aHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMTk4MjcsImV4cCI6MjA5Nzg5NTgyN30.3vP9D01YAQwqkO5dGMSCLnIUGUJmgZBbkxQ08U6p6mg';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function generateCode() {
      const randomNum = Math.floor(1000 + Math.random() * 9000);
      return `WELCOME-${randomNum}`;
    }

    document.getElementById('discountForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');
      const voucherBox = document.getElementById('voucherBox');
      const codeDisplay = document.getElementById('generatedCode');

      btn.disabled = true;
      btn.innerText = 'Generating...';
      errorMsg.style.display = 'none';

      const name = document.getElementById('client_name').value.trim();
      const email = document.getElementById('client_email').value.trim();
      const newCode = generateCode();

      const { data, error } = await supabaseClient
        .from('discount_codes')
        .insert([{ client_name: name, client_email: email, discount_code: newCode }]);

      if (error) {
        errorMsg.innerText = 'Unable to generate code. Please check your connection.';
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Get My Code';
      } else {
        document.getElementById('discountForm').style.display = 'none';
        codeDisplay.innerText = newCode;
        voucherBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
