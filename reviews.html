<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Reviews & Testimonials</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.5; }
    h1 { text-align: center; color: #111; }
    .card { background: #f9f9f9; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    button:hover { background: #1d4ed8; }
    .stars { color: #f59e0b; font-size: 1.2rem; }
    .review-item { border-bottom: 1px solid #eee; padding: 15px 0; }
    .review-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .review-date { color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>

  <h1>What Our Clients Say</h1>

  <!-- Submit Review Form -->
  <div class="card">
    <h3>Leave a Review</h3>
    <form id="reviewForm">
      <div class="form-group">
        <label for="client_name">Your Name</label>
        <input type="text" id="client_name" required placeholder="e.g. Sarah M.">
      </div>
      <div class="form-group">
        <label for="star_rating">Rating</label>
        <select id="star_rating" required>
          <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
          <option value="4">⭐⭐⭐⭐ (4/5)</option>
          <option value="3">⭐⭐⭐ (3/5)</option>
          <option value="2">⭐⭐ (2/5)</option>
          <option value="1">⭐ (1/5)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="review_text">Your Experience</label>
        <textarea id="review_text" rows="4" required placeholder="How was your session?"></textarea>
      </div>
      <button type="submit" id="submitBtn">Submit Review</button>
    </form>
    <p id="statusMsg" style="text-align: center; font-weight: bold; margin-top: 10px;"></p>
  </div>

  <!-- Reviews List Display -->
  <h2>Recent Reviews</h2>
  <div id="reviewsList">Loading reviews...</div>

  <script>
    // 1. REPLACE THESE WITH YOUR SUPABASE DETAILS
    const SUPABASE_URL = 'https://yelkiigjgpzqtqkuuhxt.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllbGtpaWdqZ3B6cXRxa3V1aHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMTk4MjcsImV4cCI6MjA5Nzg5NTgyN30.3vP9D01YAQwqkO5dGMSCLnIUGUJmgZBbkxQ08U6p6mg';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Fetch and display existing reviews
    async function fetchReviews() {
      const { data, error } = await supabase
        .from('testimonials')
        .select('*')
        .eq('is_approved', true)
        .order('created_at', { ascending: false });

      const container = document.getElementById('reviewsList');
      if (error) {
        container.innerHTML = '<p>Unable to load reviews right now.</p>';
        return;
      }

      if (data.length === 0) {
        container.innerHTML = '<p>No reviews yet. Be the first to leave one!</p>';
        return;
      }

      container.innerHTML = data.map(r => `
        <div class="review-item">
          <div class="review-header">
            <span>${escapeHtml(r.client_name)}</span>
            <span class="stars">${'★'.repeat(r.star_rating)}${'☆'.repeat(5 - r.star_rating)}</span>
          </div>
          <p>${escapeHtml(r.review_text)}</p>
          <span class="review-date">${new Date(r.created_at).toLocaleDateString()}</span>
        </div>
      `).join('');
    }

    // Helper to prevent script injection
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 3. Handle form submission
    document.getElementById('reviewForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMsg');
      
      btn.disabled = true;
      status.innerText = "Submitting...";

      const newReview = {
        client_name: document.getElementById('client_name').value,
        star_rating: parseInt(document.getElementById('star_rating').value),
        review_text: document.getElementById('review_text').value
      };

      const { error } = await supabase.from('testimonials').insert([newReview]);

      if (error) {
        status.style.color = "red";
        status.innerText = "Error submitting review. Please try again.";
        btn.disabled = false;
      } else {
        status.style.color = "green";
        status.innerText = "Thank you! Your review has been posted.";
        document.getElementById('reviewForm').reset();
        btn.disabled = false;
        fetchReviews(); // Refresh the list automatically
      }
    });

    // Run on page load
    fetchReviews();
  </script>
</body>
</html>
