<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Reviews & Testimonials</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --blue: #0017FF;
      --blue-bright: #3040ff;
      --black: #000000;
      --near-black: #080810;
      --white: #ffffff;
      --gray: #a0a8cc;
      --card-bg: #0a0c1a;
      --card-border: rgba(0, 23, 255, 0.25);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 60px;
      color: var(--white);
      line-height: 1.6;
      background: var(--black);
    }

    h1, h2, h3 {
      color: var(--white);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 30px rgba(0, 23, 255, 0.12);
    }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; color: var(--gray); }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      box-sizing: border-box;
      background: rgba(255,255,255,0.04);
      color: var(--white);
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(255,255,255,0.45);
    }

    button {
      background: var(--blue);
      color: var(--white);
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s ease;
    }

    button:hover { background: var(--blue-bright); }
    .stars { color: #3040ff; font-size: 1.2rem; }
    .review-item { border-bottom: 1px solid rgba(255,255,255,0.12); padding: 16px 0; }
    .review-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: var(--white); }
    .review-date { color: var(--gray); font-size: 0.85rem; }
    #reviewsList p { color: var(--gray); }
  </style>
</head>
<body>

  <h1>What Our Clients Say</h1>

  <!-- Submit Review Form -->
  <div class="card">
    <h3>Leave a Review</h3>
    <form id="reviewForm">
      <div class="form-group">
        <label for="client_name">Your Name</label>
        <input type="text" id="client_name" required placeholder="e.g. Sarah M.">
      </div>
      <div class="form-group">
        <label for="star_rating">Rating</label>
        <select id="star_rating" required>
          <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
          <option value="4">⭐⭐⭐⭐ (4/5)</option>
          <option value="3">⭐⭐⭐ (3/5)</option>
          <option value="2">⭐⭐ (2/5)</option>
          <option value="1">⭐ (1/5)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="review_text">Your Experience</label>
        <textarea id="review_text" rows="4" required placeholder="How was your session?"></textarea>
      </div>
      <button type="submit" id="submitBtn">Submit Review</button>
    </form>
    <p id="statusMsg" style="text-align: center; font-weight: bold; margin-top: 10px;"></p>
  </div>

  <!-- Reviews List Display -->
  <h2>Recent Reviews</h2>
  <div id="reviewsList">Loading reviews...</div>

  <script>
    // 1. Initialize the client with a different name
    const SUPABASE_URL = 'https://yelkiigjgpzqtqkuuhxt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllbGtpaWdqZ3B6cXRxa3V1aHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMTk4MjcsImV4cCI6MjA5Nzg5NTgyN30.3vP9D01YAQwqkO5dGMSCLnIUGUJmgZBbkxQ08U6p6mg';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Fetch and display existing reviews
    async function fetchReviews() {
      const { data, error } = await supabaseClient
        .from('testimonials')
        .select('*')
        .eq('is_approved', true)
        .order('created_at', { ascending: false });

      const container = document.getElementById('reviewsList');
      if (error) {
        container.innerHTML = '<p>Unable to load reviews right now.</p>';
        return;
      }

      if (data.length === 0) {
        container.innerHTML = '<p>No reviews yet. Be the first to leave one!</p>';
        return;
      }

      container.innerHTML = data.map(r => `
        <div class="review-item">
          <div class="review-header">
            <span>${escapeHtml(r.client_name)}</span>
            <span class="stars">${'★'.repeat(r.star_rating)}${'☆'.repeat(5 - r.star_rating)}</span>
          </div>
          <p>${escapeHtml(r.review_text)}</p>
          <span class="review-date">${new Date(r.created_at).toLocaleDateString()}</span>
        </div>
      `).join('');
    }

    // Helper to prevent script injection
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 3. Handle form submission
    document.getElementById('reviewForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMsg');
      
      btn.disabled = true;
      status.innerText = "Submitting...";

      const newReview = {
        client_name: document.getElementById('client_name').value,
        star_rating: parseInt(document.getElementById('star_rating').value),
        review_text: document.getElementById('review_text').value
      };

      const { error } = await supabaseClient.from('testimonials').insert([newReview]);

      if (error) {
        status.style.color = "red";
        status.innerText = "Error submitting review. Please try again.";
        btn.disabled = false;
      } else {
        status.style.color = "green";
        status.innerText = "Thank you! Your review has been posted.";
        document.getElementById('reviewForm').reset();
        btn.disabled = false;
        fetchReviews(); // Refresh the list automatically
      }
    });

    // Run on page load
    fetchReviews();
  </script>
</body>
</html>
